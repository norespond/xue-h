<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>作品详情 - 雪蕐档案馆</title>
    <link rel="icon" href="assets/icon/favicon.ico" />
    <link rel="preconnect" href="https://norespond.github.io" crossorigin />
    <link rel="stylesheet" href="assets/css/game.css" />
    <link rel="stylesheet" href="assets/css/player.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header" aria-label="站点导航">
        <button class="back-button" type="button" id="back-button" aria-label="返回上一页">返回</button>
        <a class="brand" href="./index.html" aria-label="返回雪蕐档案馆首页">
          <span class="brand-mark"></span>
          <span>雪蕐档案馆</span>
        </a>
        <button class="theme-toggle" type="button" id="theme-toggle" aria-label="切换日夜主题">
          夜间
        </button>
      </header>

      <main id="game-root" aria-live="polite">
        <section class="loading-block">
          <p>正在读取作品档案...</p>
        </section>
      </main>
    </div>

    <div class="player-bar" id="player-bar" hidden>
      <img class="player-cover" id="player-cover" alt="" />
      <div class="player-main">
        <div class="player-title" id="player-title">未选择曲目</div>
        <div class="player-time" id="player-time">00:00 / 00:00</div>
        <input class="player-progress" id="player-progress" type="range" min="0" max="100" value="0" />
      </div>
      <div class="player-controls" aria-label="播放器控制">
        <button class="player-button" type="button" id="player-prev" aria-label="上一首">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><title>上一首</title><path d="M13 6v12l-8-6 8-6zm8 0v12h-2V6h2z"/></svg>
          <span class="visually-hidden">上一首</span>
        </button>
        <button class="player-button" type="button" id="player-toggle" aria-label="播放或暂停" aria-pressed="false">
          <svg class="icon-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><title>播放/暂停</title><path d="M8 5v14l11-7z"/></svg>
          <span class="visually-hidden">播放或暂停</span>
        </button>
        <button class="player-button" type="button" id="player-next" aria-label="下一首">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><title>下一首</title><path d="M5 6v12l8-6-8-6zm14 0v12h-2V6h2z"/></svg>
          <span class="visually-hidden">下一首</span>
        </button>
        <button class="player-button player-close" type="button" id="player-close" aria-label="关闭播放器">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><title>关闭播放器</title><path d="M6 6l12 12M18 6L6 18"/></svg>
          <span class="visually-hidden">关闭播放器</span>
        </button>
      </div>
      <audio id="audio-player"></audio>
    </div>

    <div class="cg-viewer" id="cg-viewer" hidden aria-modal="true" role="dialog" aria-label="CG 预览">
      <button class="viewer-close" type="button" id="viewer-close" aria-label="关闭预览">关闭</button>
      <button class="viewer-nav viewer-prev" type="button" id="viewer-prev" aria-label="上一张">上一张</button>
      <figure class="viewer-figure">
        <img class="viewer-image" id="viewer-image" alt="" />
        <figcaption class="viewer-caption" id="viewer-caption"></figcaption>
      </figure>
      <button class="viewer-nav viewer-next" type="button" id="viewer-next" aria-label="下一张">下一张</button>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id") || "001";
      window.location.replace(`./index.html?id=${encodeURIComponent(id)}`);
    </script>
  </body>
</html>
