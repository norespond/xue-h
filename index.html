<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>雪蕐档案馆</title>
  <link rel="icon" href="assets/icon/favicon.ico" />
  <link rel="preconnect" href="https://norespond.github.io" crossorigin />
  <link rel="stylesheet" href="assets/css/game.css" />
  <link rel="stylesheet" href="assets/css/home.css" />
</head>

<body>
  <div class="page-shell">
    <header class="site-header" aria-label="站点导航">
      <button class="back-button app-back" type="button" id="app-back" aria-label="返回作品列表" hidden>返回</button>
      <a class="brand" href="./index.html" aria-label="雪蕐档案馆首页">
        <span class="brand-mark"></span>
        <span>雪蕐档案馆</span>
      </a>
      <div class="header-actions">
        <button class="theme-toggle" type="button" id="theme-toggle" aria-label="切换日夜主题">
          夜间
        </button>
        <label class="search-box header-search" aria-label="搜索作品">
          <span class="search-control">
            <input id="game-search" type="search" placeholder="搜索作品" autocomplete="off" />
            <button class="clear-search" type="button" id="clear-search" aria-label="清空搜索" hidden>清空</button>
          </span>
        </label>
      </div>
    </header>

    <main id="app-root" aria-live="polite"></main>

    <footer class="site-footer" id="about">
      <p>资源均来源于网络，仅作为个人整理与本地测试用途。</p>
    </footer>
  </div>

  <div class="player-bar" id="player-bar" hidden>
    <img class="player-cover" id="player-cover" alt="" />
    <div class="player-main">
      <div class="player-title" id="player-title">未选择曲目</div>
      <div class="player-time" id="player-time">00:00 / 00:00</div>
      <input class="player-progress" id="player-progress" type="range" min="0" max="100" value="0" />
    </div>
    <div class="player-controls" aria-label="播放器控制">
      <button class="player-button" type="button" id="player-prev" aria-label="上一首">上一首</button>
      <button class="player-button" type="button" id="player-toggle" aria-label="播放或暂停">播放</button>
      <button class="player-button" type="button" id="player-next" aria-label="下一首">下一首</button>
      <button class="player-button player-close" type="button" id="player-close" aria-label="关闭播放器">关闭</button>
    </div>
    <audio id="audio-player"></audio>
  </div>

  <div class="cg-viewer" id="cg-viewer" hidden aria-modal="true" role="dialog" aria-label="CG 预览">
    <button class="viewer-close" type="button" id="viewer-close" aria-label="关闭预览">关闭</button>
    <button class="viewer-nav viewer-prev" type="button" id="viewer-prev" aria-label="上一张">上一张</button>
    <figure class="viewer-figure">
      <img class="viewer-image" id="viewer-image" alt="" />
      <figcaption class="viewer-caption" id="viewer-caption"></figcaption>
    </figure>
    <button class="viewer-nav viewer-next" type="button" id="viewer-next" aria-label="下一张">下一张</button>
  </div>

  <a class="back-to-top" href="#" aria-label="回到顶部">↑</a>

  <script src="assets/js/app.js" defer></script>
</body>

</html>
